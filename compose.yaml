name: reqtest
services:
  mail:
    image: axllent/mailpit:v1.31.3
    profiles: ["mail"]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: reqtest
      POSTGRES_USER: reqtest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reqtest}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reqtest -d reqtest"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
